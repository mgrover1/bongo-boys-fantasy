[project]
name = "bongo-boys"
version = "0.1.0"
description = "Sleeper fantasy football draft optimizer and in-season tools"
requires-python = ">=3.11"
dependencies = ["requests>=2.32"]

[project.scripts]
bongo = "bongo_boys.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bongo_boys"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
